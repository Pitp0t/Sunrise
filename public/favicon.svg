<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <radialGradient id="sunGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FF8C00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6B00;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Sun rays -->
  <g opacity="0.8">
    <line x1="50" y1="10" x2="50" y2="25" stroke="#FFA500" stroke-width="3" stroke-linecap="round"/>
    <line x1="73.5" y1="16.5" x2="64.5" y2="28.5" stroke="#FFA500" stroke-width="3" stroke-linecap="round"/>
    <line x1="90" y1="33" x2="75" y2="42" stroke="#FFA500" stroke-width="3" stroke-linecap="round"/>
    <line x1="90" y1="60" x2="75" y2="58" stroke="#FFA500" stroke-width="3" stroke-linecap="round"/>
    <line x1="26.5" y1="16.5" x2="35.5" y2="28.5" stroke="#FFA500" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="33" x2="25" y2="42" stroke="#FFA500" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="60" x2="25" y2="58" stroke="#FFA500" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Sun circle -->
  <circle cx="50" cy="50" r="22" fill="url(#sunGradient)"/>
  
  <!-- Horizon line -->
  <line x1="0" y1="75" x2="100" y2="75" stroke="#1F2937" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Ground -->
  <rect x="0" y="75" width="100" height="25" fill="#111827"/>
</svg>
